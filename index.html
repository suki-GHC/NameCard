<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GroovyHouse Creative</title>
        <!-- 瀏覽器分頁 Tab Icon -->
    <link rel="icon" type="image/png" href="tabLogo_circle.png">
    <!-- 引入 Google Fonts: Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500&display=swap" rel="stylesheet">
    <style>
        /* 宣告自訂字型 GrandCru-LightS (僅用於 Coming Soon) */
        @font-face {
            font-family: 'GrandCru';
            src: url('GrandCru-LightS.woff2') format('woff2');
            font-weight: 300;
            font-style: normal;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 300;
            background-color: #24419c;
            overflow: hidden;
        }

        /* 頁面容器：Flexbox 上下撐開 */
        .page-container {
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, #2f52b6 0%, #24419c 100%);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            position: relative;
            overflow: hidden;
            box-sizing: border-box;
            padding: 20px; /* 手機版 Padding */
        }

        /* 光暈 1：極光白藍 #e9fcff (Mobile 大塊光暈) */
        .glow-1 {
            position: absolute;
            top: 5%;
            left: 10%;
            width: 110vw;
            height: 110vw;
            background: radial-gradient(circle, rgba(233, 252, 255, 0.95) 0%, rgba(46, 202, 241, 0.4) 50%, transparent 75%);
            border-radius: 50%;
            filter: blur(45px);
            animation: flowOrb1 2.2s ease-in-out infinite alternate;
            z-index: 1;
        }

        /* 光暈 2：電光天藍 #2ecaf1 */
        .glow-2 {
            position: absolute;
            bottom: 5%;
            right: 10%;
            width: 120vw;
            height: 120vw;
            background: radial-gradient(circle, rgba(46, 202, 241, 0.9) 0%, rgba(36, 65, 156, 0.35) 60%, transparent 80%);
            border-radius: 50%;
            filter: blur(55px);
            animation: flowOrb2 2.5s ease-in-out infinite alternate;
            z-index: 1;
        }

        /* 光暈 3：中間交織點 */
        .glow-3 {
            position: absolute;
            top: 20%;
            left: 20%;
            width: 100vw;
            height: 100vw;
            background: radial-gradient(circle, rgba(233, 252, 255, 0.8) 0%, rgba(46, 202, 241, 0.45) 55%, transparent 80%);
            border-radius: 50%;
            filter: blur(40px);
            animation: flowOrb3 2.3s ease-in-out infinite alternate;
            z-index: 1;
        }

        /* 桌面版（768px以上）：完全維持原本比例與置中 */
        @media (min-width: 768px) {
            .page-container {
                justify-content: center;
                padding: 0;
            }
            .glow-1 {
                top: 5%;
                left: 10%;
                width: 60vw;
                height: 60vw;
            }
            .glow-2 {
                bottom: 5%;
                right: 10%;
                width: 65vw;
                height: 65vw;
            }
            .glow-3 {
                top: 25%;
                left: 25%;
                width: 55vw;
                height: 55vw;
            }
        }

        /* 高速流動動畫 */
        @keyframes flowOrb1 {
            0% { transform: translate3d(0vw, 0vh, 0) scale(1); }
            100% { transform: translate3d(25vw, 18vh, 0) scale(1.25); }
        }

        @keyframes flowOrb2 {
            0% { transform: translate3d(0vw, 0vh, 0) scale(1); }
            100% { transform: translate3d(-25vw, -18vh, 0) scale(0.85); }
        }

        @keyframes flowOrb3 {
            0% { transform: translate3d(0vw, 0vh, 0) scale(0.9); }
            100% { transform: translate3d(-18vw, 22vh, 0) scale(1.2); }
        }

        /* === 關鍵修改：Mobile 頂部佔位 === */
        /* 預設手機版：設定一個較大嘅高度，將內容推向上方 */
        .spacer-top {
            height: 6vh; /* 手機版頂部留白 (可按需要微調) */
            flex-shrink: 0;
        }
        /* 桌面版（768px以上）：隱藏佔位，讓內容恢復絕對置中 */
        @media (min-width: 768px) {
            .spacer-top { display: none; }
        }

        /* 中間內容區 */
        .content {
            text-align: center;
            padding: 10px; /* 減少 Padding 令內容更緊湊 */
            z-index: 10;
            flex-shrink: 0;
        }

        .logo img {
            max-width: 260px; /* 手機版 Logo 大小 */
            width: 100%;
            height: auto;
            margin-bottom: 0.8rem;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        .coming-soon h2 {
            font-family: 'GrandCru', sans-serif;
            color: #ffffff;
            font-size: 1.1rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin: 0;
            font-weight: 300;
            opacity: 0.95;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
        }

        /* 桌面版放大調整 */
        @media (min-width: 768px) {
            .logo img {
                max-width: 750px;
                margin-bottom: 2.2rem;
            }
            .coming-soon h2 {
                font-size: 1.8rem;
                letter-spacing: 8px;
            }
        }

        /* 底部 Copyright：手機電腦都保證穩陣見到 */
        .footer-copy {
            z-index: 10;
            color: rgba(255, 255, 255, 0.85);
            font-size: 10px;
            letter-spacing: 1px;
            white-space: nowrap;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
            padding-bottom: 10px; /* 手機版底部距離 */
            flex-shrink: 0;
        }
        @media (min-width: 768px) {
            .footer-copy {
                position: absolute;
                bottom: 25px;
                left: 50%;
                transform: translateX(-50%);
                padding-bottom: 0;
            }
        }
    </style>
</head>
<body>

    <div class="page-container">
        <!-- 3舊高速流動嘅光暈 -->
        <div class="glow-1"></div>
        <div class="glow-2"></div>
        <div class="glow-3"></div>

        <!-- 頂部佔位：Mobile 版高度設為 6vh，將內容推上 -->
        <div class="spacer-top"></div>

        <!-- 中間 Logo 與 Coming Soon -->
        <div class="content">
            <div class="logo">
                <img src="logo.png" alt="GroovyHouse Creative Logo">
            </div>
            <div class="coming-soon">
                <h2>COMING SOON</h2>
            </div>
        </div>

        <!-- 底部版權宣告 -->
        <div class="footer-copy">
            © GroovyHouse Ltd. All Rights Reserved.
        </div>
    </div>

</body>
</html>
