<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GroovyHouse Creative</title>
    <!-- 引入 Google Fonts: Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500&display=swap" rel="stylesheet">
    <style>
        /* 宣告自訂字型 GrandCru-LightS (僅用於 Coming Soon) */
        @font-face {
            font-family: 'GrandCru';
            src: url('GrandCru-LightS.woff2') format('woff2');
            font-weight: 300;
            font-style: normal;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 300;
            background-color: #24419c;
            overflow: hidden;
        }

        /* 頁面容器 */
        .page-container {
            width: 100%;
            height: 100vh;
            background: radial-gradient(circle at 50% 50%, #2f52b6 0%, #24419c 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        /* 光暈 1：極光白藍 #e9fcff */
        .glow-1 {
            position: absolute;
            top: 5%;
            left: 10%;
            width: 60vw;
            height: 60vw;
            background: radial-gradient(circle, rgba(233, 252, 255, 0.9) 0%, rgba(46, 202, 241, 0.35) 50%, transparent 75%);
            border-radius: 50%;
            filter: blur(50px);
            will-change: transform;
            animation: moveGlow1 9s ease-in-out infinite alternate;
            z-index: 1;
        }

        /* 光暈 2：電光天藍 #2ecaf1 */
        .glow-2 {
            position: absolute;
            bottom: 5%;
            right: 10%;
            width: 65vw;
            height: 65vw;
            background: radial-gradient(circle, rgba(46, 202, 241, 0.85) 0%, rgba(36, 65, 156, 0.3) 60%, transparent 80%);
            border-radius: 50%;
            filter: blur(60px);
            will-change: transform;
            animation: moveGlow2 11s ease-in-out infinite alternate;
            z-index: 1;
        }

        /* 光暈 3：中間交織點 */
        .glow-3 {
            position: absolute;
            top: 25%;
            left: 25%;
            width: 50vw;
            height: 50vw;
            background: radial-gradient(circle, rgba(233, 252, 255, 0.7) 0%, rgba(46, 202, 241, 0.4) 55%, transparent 80%);
            border-radius: 50%;
            filter: blur(45px);
            will-change: transform;
            animation: moveGlow3 10s ease-in-out infinite alternate;
            z-index: 1;
        }

        /* 強制開啓 GPU 硬件加速嘅慢丁丁流動動畫 */
        @keyframes moveGlow1 {
            0% { transform: translate(0px, 0px) scale(1); }
            100% { transform: translate(45px, 35px) scale(1.15); }
        }

        @keyframes moveGlow2 {
            0% { transform: translate(0px, 0px) scale(1); }
            100% { transform: translate(-50px, -40px) scale(0.9); }
        }

        @keyframes moveGlow3 {
            0% { transform: translate(0px, 0px) scale(0.95); }
            100% { transform: translate(-35px, 45px) scale(1.1); }
        }

        /* 中間內容區 */
        .content {
            text-align: center;
            padding: 20px;
            z-index: 10;
        }

        .logo img {
            max-width: 280px;
            width: 100%;
            height: auto;
            margin-bottom: 1rem;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        .coming-soon h2 {
            font-family: 'GrandCru', sans-serif;
            color: #ffffff;
            font-size: 1.1rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin: 0;
            font-weight: 300;
            opacity: 0.95;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
        }

        /* 桌面版放大調整 */
        @media (min-width: 768px) {
            .logo img {
                max-width: 750px;
                margin-bottom: 2.2rem;
            }
            .coming-soon h2 {
                font-size: 1.8rem;
                letter-spacing: 8px;
            }
        }

        /* 底部 Copyright */
        .footer-copy {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.85);
            font-size: 10px;
            letter-spacing: 1px;
            z-index: 10;
            white-space: nowrap;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>

    <div class="page-container">
        <!-- 3舊開咗 GPU 加速嘅流動光暈 -->
        <div class="glow-1"></div>
        <div class="glow-2"></div>
        <div class="glow-3"></div>

        <!-- 中間 Logo 與 Coming Soon -->
        <div class="content">
            <div class="logo">
                <img src="logo.png" alt="GroovyHouse Creative Logo">
            </div>
            <div class="coming-soon">
                <h2>COMING SOON</h2>
            </div>
        </div>

        <!-- 底部版權宣告 -->
        <div class="footer-copy">
            © GroovyHouse Ltd. All Rights Reserved.
        </div>
    </div>

</body>
</html>
