<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GroovyHouse Creative</title>
    <!-- 引入 Google Fonts: Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500&display=swap" rel="stylesheet">
    <style>
        /* 宣告自訂字型 GrandCru-LightS (僅用於 Coming Soon) */
        @font-face {
            font-family: 'GrandCru';
            src: url('GrandCru-LightS.woff2') format('woff2');
            font-weight: 300;
            font-style: normal;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 300;
            background-color: #24419c; /* 深色底色作為基調 */
            overflow: hidden;
        }

        /* 頁面容器 */
        .page-container {
            width: 100%;
            height: 100vh;
            background: radial-gradient(circle at 50% 50%, #2f52b6 0%, #24419c 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        /* 光暈 1：以極光白藍 #e9fcff 為主，適中大小，慢丁丁流動 */
        .glow-1 {
            position: absolute;
            top: 15%;
            left: 20%;
            width: 45vw;
            height: 45vw;
            background: radial-gradient(circle, rgba(233, 252, 255, 0.85) 0%, rgba(46, 202, 241, 0.3) 50%, transparent 75%);
            border-radius: 50%;
            filter: blur(45px);
            animation: slowFlow1 8s ease-in-out infinite alternate;
            z-index: 1;
        }

        /* 光暈 2：以電光天藍 #2ecaf1 為主，細緻光球 */
        .glow-2 {
            position: absolute;
            bottom: 15%;
            right: 20%;
            width: 50vw;
            height: 50vw;
            background: radial-gradient(circle, rgba(46, 202, 241, 0.8) 0%, rgba(36, 65, 156, 0.3) 60%, transparent 80%);
            border-radius: 50%;
            filter: blur(55px);
            animation: slowFlow2 10s ease-in-out infinite alternate;
            z-index: 1;
        }

        /* 光暈 3：兩色交織嘅精緻亮光點 */
        .glow-3 {
            position: absolute;
            top: 40%;
            right: 25%;
            width: 35vw;
            height: 35vw;
            background: radial-gradient(circle, rgba(233, 252, 255, 0.7) 0%, rgba(46, 202, 241, 0.4) 50%, transparent 75%);
            border-radius: 50%;
            filter: blur(40px);
            animation: slowFlow3 9s ease-in-out infinite alternate;
            z-index: 1;
        }

        /* 慢丁丁、優雅嘅緩慢呼吸流動動畫（8-10秒） */
        @keyframes slowFlow1 {
            0% { transform: translate3d(0, 0, 0) scale(0.9); }
            100% { transform: translate3d(12vw, 10vh, 0) scale(1.15); }
        }

        @keyframes slowFlow2 {
            0% { transform: translate3d(0, 0, 0) scale(1); }
            100% { transform: translate3d(-15vw, -10vh, 0) scale(0.85); }
        }

        @keyframes slowFlow3 {
            0% { transform: translate3d(0, 0, 0) scale(0.85); }
            100% { transform: translate3d(-10vw, 12vh, 0) scale(1.1); }
        }

        /* 中間內容區 */
        .content {
            text-align: center;
            padding: 20px;
            z-index: 10;
        }

        .logo img {
            max-width: 280px;
            width: 100%;
            height: auto;
            margin-bottom: 1rem;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        .coming-soon h2 {
            font-family: 'GrandCru', sans-serif;
            color: #ffffff;
            font-size: 1.1rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin: 0;
            font-weight: 300;
            opacity: 0.95;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
        }

        /* 桌面版放大調整 */
        @media (min-width: 768px) {
            .logo img {
                max-width: 750px;
                margin-bottom: 2.2rem;
            }
            .coming-soon h2 {
                font-size: 1.8rem;
                letter-spacing: 8px;
            }
        }

        /* 底部 Copyright */
        .footer-copy {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.85);
            font-size: 10px;
            letter-spacing: 1px;
            z-index: 10;
            white-space: nowrap;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>

    <div class="page-container">
        <!-- 3舊適中大小、慢節奏漂浮嘅光暈，完美呈現 3 隻色嘅層次 -->
        <div class="glow-1"></div>
        <div class="glow-2"></div>
        <div class="glow-3"></div>

        <!-- 中間 Logo 與 Coming Soon -->
        <div class="content">
            <div class="logo">
                <img src="logo.png" alt="GroovyHouse Creative Logo">
            </div>
            <div class="coming-soon">
                <h2>COMING SOON</h2>
            </div>
        </div>

        <!-- 底部版權宣告 -->
        <div class="footer-copy">
            © GroovyHouse Ltd. All Rights Reserved.
        </div>
    </div>

</body>
</html>
