<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GroovyHouse Creative</title>
    <!-- 引入 Google Fonts: Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500&display=swap" rel="stylesheet">
    <style>
        /* 宣告自訂字型 GrandCru-LightS (僅用於 Coming Soon) */
        @font-face {
            font-family: 'GrandCru';
            src: url('GrandCru-LightS.woff2') format('woff2');
            font-weight: 300;
            font-style: normal;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 300;
            background-color: #24419c;
            overflow: hidden;
        }

        /* 頁面容器：以深邃 VJ 藍色做底 */
        .page-container {
            width: 100%;
            height: 100vh;
            background: #24419c;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        /* 大塊光暈 1：以極光白藍 #e9fcff 為主，大範圍暈染，快速流動 */
        .glow-1 {
            position: absolute;
            top: -20%;
            left: -10%;
            width: 70vw;
            height: 70vw;
            background: radial-gradient(circle, rgba(233, 252, 255, 0.9) 0%, rgba(46, 202, 241, 0.5) 50%, transparent 75%);
            border-radius: 50%;
            filter: blur(60px);
            animation: fastFlow1 3s ease-in-out infinite alternate;
            z-index: 1;
        }

        /* 大塊光暈 2：以電光天藍 #2ecaf1 為主，營造大片光感 */
        .glow-2 {
            position: absolute;
            bottom: -20%;
            right: -10%;
            width: 75vw;
            height: 75vw;
            background: radial-gradient(circle, rgba(46, 202, 241, 0.85) 0%, rgba(233, 252, 255, 0.4) 45%, transparent 75%);
            border-radius: 50%;
            filter: blur(70px);
            animation: fastFlow2 3.5s ease-in-out infinite alternate;
            z-index: 1;
        }

        /* 大塊光暈 3：中心交織嘅冰藍光波，加強整體亮度 */
        .glow-3 {
            position: absolute;
            top: 20%;
            right: 15%;
            width: 60vw;
            height: 60vw;
            background: radial-gradient(circle, rgba(233, 252, 255, 0.75) 0%, rgba(46, 202, 241, 0.3) 60%, transparent 80%);
            border-radius: 50%;
            filter: blur(50px);
            animation: fastFlow3 2.5s ease-in-out infinite alternate;
            z-index: 1;
        }

        /* 光暈高速流動動畫（3秒快速交織） */
        @keyframes fastFlow1 {
            0% { transform: translate3d(0, 0, 0) scale(1); }
            100% { transform: translate3d(25vw, 20vh, 0) scale(1.25); }
        }

        @keyframes fastFlow2 {
            0% { transform: translate3d(0, 0, 0) scale(1.1); }
            100% { transform: translate3d(-25vw, -20vh, 0) scale(0.9); }
        }

        @keyframes fastFlow3 {
            0% { transform: translate3d(0, 0, 0) scale(0.9); }
            100% { transform: translate3d(-20vw, 25vh, 0) scale(1.3); }
        }

        /* 中間內容區（Logo + Coming Soon，層級設在光暈之上） */
        .content {
            text-align: center;
            padding: 20px;
            z-index: 10;
        }

        .logo img {
            max-width: 280px;
            width: 100%;
            height: auto;
            margin-bottom: 1rem;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        .coming-soon h2 {
            font-family: 'GrandCru', sans-serif;
            color: #ffffff;
            font-size: 1.1rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin: 0;
            font-weight: 300;
            opacity: 0.95;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
        }

        /* 桌面版放大調整 */
        @media (min-width: 768px) {
            .logo img {
                max-width: 750px;
                margin-bottom: 2.2rem;
            }
            .coming-soon h2 {
                font-size: 1.8rem;
                letter-spacing: 8px;
            }
        }

        /* 底部 Copyright */
        .footer-copy {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.85);
            font-size: 10px;
            letter-spacing: 1px;
            z-index: 10;
            white-space: nowrap;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>

    <div class="page-container">
        <!-- 3舊超大塊、高亮度嘅流動光暈（主力使用 #e9fcff 與 #2ecaf1） -->
        <div class="glow-1"></div>
        <div class="glow-2"></div>
        <div class="glow-3"></div>

        <!-- 中間 Logo 與 Coming Soon -->
        <div class="content">
            <div class="logo">
                <img src="logo.png" alt="GroovyHouse Creative Logo">
            </div>
            <div class="coming-soon">
                <h2>COMING SOON</h2>
            </div>
        </div>

        <!-- 底部版權宣告 -->
        <div class="footer-copy">
            © GroovyHouse Ltd. All Rights Reserved.
        </div>
    </div>

</body>
</html>
