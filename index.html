<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GroovyHouse Creative</title>
    <!-- 引入 Google Fonts: Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500&display=swap" rel="stylesheet">
    <style>
        /* 宣告自訂字型 GrandCru-LightS (僅用於 Coming Soon) */
        @font-face {
            font-family: 'GrandCru';
            src: url('GrandCru-LightS.woff2') format('woff2');
            font-weight: 300;
            font-style: normal;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-weight: 300;
            overflow: hidden;
            background-color: #040814;
        }

        /* 純 CSS 背景容器：結合深藍底色與流動高光暈染 */
        .bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            overflow: hidden;
            background: radial-gradient(circle at 50% 50%, #0d2247 0%, #040814 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        /* 純 CSS 藍白光暈 1：模擬左上方嘅柔和高光源 */
        .ambient-glow-1 {
            position: absolute;
            top: -10%;
            left: 15%;
            width: 70vw;
            height: 70vw;
            background: radial-gradient(circle, rgba(120, 210, 255, 0.55) 0%, rgba(40, 130, 255, 0.25) 50%, transparent 75%);
            border-radius: 50%;
            filter: blur(60px);
            will-change: transform;
            animation: moveGlow1 8s ease-in-out infinite alternate;
        }

        /* 純 CSS 藍白光暈 2：模擬右下方深邃嘅藍紫漸層 */
        .ambient-glow-2 {
            position: absolute;
            bottom: -15%;
            right: 10%;
            width: 80vw;
            height: 80vw;
            background: radial-gradient(circle, rgba(0, 102, 255, 0.5) 0%, rgba(10, 35, 110, 0.3) 55%, transparent 80%);
            border-radius: 50%;
            filter: blur(70px);
            will-change: transform;
            animation: moveGlow2 10s ease-in-out infinite alternate;
        }

        /* 流動呼吸動畫軌跡 */
        @keyframes moveGlow1 {
            0% {
                transform: translate3d(-10vw, -10vh, 0) scale(1);
            }
            100% {
                transform: translate3d(15vw, 15vh, 0) scale(1.2);
            }
        }

        @keyframes moveGlow2 {
            0% {
                transform: translate3d(10vw, 10vh, 0) scale(1.1);
            }
            100% {
                transform: translate3d(-15vw, -15vh, 0) scale(0.9);
            }
        }

        /* 內容層：確保永遠喺最上層清晰顯示 */
        .content {
            position: relative;
            z-index: 10;
            padding: 20px;
            max-width: 700px;
            width: 100%;
        }

        /* === Logo 大小設定 (手機版 vs 電腦版) === */
        .logo img {
            max-width: 280px; /* 手機版 Logo 大小 */
            width: 100%;
            height: auto;
            margin-bottom: 0.8rem;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        /* === Coming Soon 字型大小設定 (手機版 vs 電腦版) === */
        .coming-soon h2 {
            font-family: 'GrandCru', sans-serif;
            color: #ffffff;
            font-size: 1.1rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin: 0;
            font-weight: 300;
            opacity: 0.9;
        }

        /* 當螢幕闊度大於 768px（平板同電腦 Desktop）時生效 */
        @media (min-width: 768px) {
            .logo img {
                max-width: 750px; /* 電腦版 Logo 大小 */
                margin-bottom: 2.2rem;
            }
            .coming-soon h2 {
                font-size: 1.8rem;
                letter-spacing: 8px;
                opacity: 1;
            }
        }

        /* 底部版權宣告細字：永久格式，獨立固定喺最底層，不隨縮放郁動 */
        .footer-copy {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            color: rgba(255, 255, 255, 0.7);
            font-size: 10px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 300;
            letter-spacing: 1px;
            text-transform: none;
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <!-- 純 CSS 藍調流動背景層 -->
    <div class="bg-container">
        <div class="ambient-glow-1"></div>
        <div class="ambient-glow-2"></div>
        
        <div class="content">
            <div class="logo">
                <img src="logo.png" alt="GroovyHouse Creative Logo">
            </div>
            <div class="coming-soon">
                <h2>COMING SOON</h2>
            </div>
        </div>
    </div>

    <!-- 底部永久版權宣告 -->
    <div class="footer-copy">
        © GroovyHouse Ltd. All Rights Reserved.
    </div>

</body>
</html>
