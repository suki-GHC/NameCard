<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GroovyHouse Creative | Coming Soon</title>
    <!-- 引入 Google Fonts: Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500&display=swap" rel="stylesheet">
    <style>
        /* 宣告自訂字型 GrandCru-LightS (僅用於 Coming Soon) */
        @font-face {
            font-family: 'GrandCru';
            src: url('GrandCru-LightS.woff2') format('woff2');
            font-weight: 300;
            font-style: normal;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-weight: 300;
        }

        /* 背景設定 */
        .bg-container {
            background-image: url('bg_landingPage.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #0b0b0b;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
        }

        /* 半透明黑色遮罩 */
        .bg-container::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0);
            z-index: 1;
        }

        .content {
            z-index: 2;
            padding: 20px;
            max-width: 700px;
            width: 100%;
        }

        /* === Logo 大小設定 (手機版 vs 電腦版) === */
        .logo img {
            max-width: 300px; /* 手機版 Logo 大小 */
            width: 100%;
            height: auto;
            margin-bottom: 0.8rem; /* 👈 縮短手機版 Logo 同 Coming Soon 之間嘅距離，讓兩者痴埋少少 */
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        /* === Coming Soon 字型大小設定 (手機版 vs 電腦版) === */
        .coming-soon h2 {
            font-family: 'GrandCru', sans-serif;
            color: #ffffff;
            font-size: 1.1rem;     /* 預設手機版字體大小 */
            letter-spacing: 4px;   /* 手機版字距 */
            text-transform: uppercase;
            margin: 0;
            font-weight: 300;
            opacity: 0.9;
        }

        /* 當螢幕闊度大於 768px（即平版同電腦 Desktop）時生效 */
        @media (min-width: 768px) {
            .logo img {
                max-width: 380px;  /* 電腦版 Logo 大小 */
                margin-bottom: 2.5rem; /* 👈 電腦版還原比較寬裕嘅距離 */
            }
            .coming-soon h2 {
                font-size: 2.5rem; /* 電腦版還原大字 */
                letter-spacing: 8px; /* 電腦版寬字距 */
                opacity: 1;
            }
        }

        /* 底部版權宣告細字 */
        .footer-copy {
            position: absolute;
            bottom: 30px;
            z-index: 2;
            color: #FFFFFF;
            font-size: 10px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 300;
            letter-spacing: 1px;
            text-transform: none;
        }
    </style>
</head>
<body>

    <div class="bg-container">
        <div class="content">
            <div class="logo">
                <img src="logo.png" alt="GroovyHouse Creative Logo">
            </div>
            <div class="coming-soon">
                <h2>COMING SOON</h2>
            </div>
        </div>

        <!-- 底部版權宣告 -->
        <div class="footer-copy">
            © 2026 GroovyHouse Ltd. All Rights Reserved.
        </div>
    </div>

</body>
</html>
