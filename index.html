<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GroovyHouse Creative | Coming Soon</title>
    <!-- 引入 Google Fonts: Plus Jakarta Sans (與卡片一致) -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500&display=swap" rel="stylesheet">
    <style>
        /* 宣告自訂字型 GrandCru-LightS (僅用於 Coming Soon) */
        @font-face {
            font-family: 'GrandCru';
            src: url('GrandCru-LightS.woff2') format('woff2');
            font-weight: 300;
            font-style: normal;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-weight: 300;
        }

        /* 背景設定 */
        .bg-container {
            background-image: url('bg_landingPage.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #0b0b0b;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
        }

        .content {
            z-index: 2;
            padding: 20px;
            max-width: 700px;
            width: 100%;
        }

        /* Logo 放大設定 */
        .logo img {
            max-width: 600px;
            width: 100%;
            height: auto;
            margin-bottom: 2.5rem;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        /* 套用 GrandCru-LightS 字型 (無陰影) */
        .coming-soon h2 {
            font-family: 'GrandCru', sans-serif;
            color: #ffffff;
            font-size: 2rem;
            letter-spacing: 8px;
            text-transform: uppercase;
            margin: 0;
            font-weight: 50;
        }

        /* 底部版權宣告細字（取消全大階） */
        .footer-copy {
            position: absolute;
            bottom: 30px;
            z-index: 2;
            color: #888888;
            font-size: 10px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 300;
            letter-spacing: 1px;
            text-transform: none;
        }
    </style>
</head>
<body>

    <div class="bg-container">
        <div class="content">
            <div class="logo">
                <img src="logo.png" alt="GroovyHouse Creative Logo">
            </div>
            <div class="coming-soon">
                <h2>COMING SOON</h2>
            </div>
        </div>

        <!-- 底部版權宣告 -->
        <div class="footer-copy">
            © 2026 GroovyHouse Ltd. All Rights Reserved.
        </div>
    </div>

</body>
</html>
