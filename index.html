<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GroovyHouse Creative | Coming Soon</title>
    <!-- 引入 Google Fonts: Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500&display=swap" rel="stylesheet">
    <style>
        /* 宣告自訂字型 GrandCru-LightS (僅用於 Coming Soon) */
        @font-face {
            font-family: 'GrandCru';
            src: url('GrandCru-LightS.woff2') format('woff2');
            font-weight: 300;
            font-style: normal;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-weight: 300;
            overflow: hidden;
            background-color: #0b0b0b;
        }

        /* 專門負責動態流動嘅背景圖片容器（手機與電腦速度完全同步） */
        .bg-image-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .bg-image-container img {
            width: 130%;
            height: 130%;
            object-fit: cover;
            position: absolute;
            top: -15%;
            left: -15%;
            animation: gradientMotion 6s ease-in-out infinite alternate; /* 手機與電腦統一為 6 秒流動速度 */
        }

        /* 手機與電腦完全一致嘅流動與呼吸動畫特效 */
        @keyframes gradientMotion {
            0% {
                transform: scale(1) translate(0px, 0px);
            }
            50% {
                transform: scale(1.04) translate(-15px, -10px);
            }
            100% {
                transform: scale(1) translate(10px, 15px);
            }
        }

        /* 內容置中容器 */
        .bg-container {
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            z-index: 2;
        }

        .content {
            padding: 20px;
            max-width: 700px;
            width: 100%;
        }

        /* === Logo 大小設定 (手機版 vs 電腦版) === */
        .logo img {
            max-width: 300px; /* 手機版 Logo 大小 */
            width: 100%;
            height: auto;
            margin-bottom: 0.8rem; /* 手機版 Logo 同 Coming Soon 距離 */
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        /* === Coming Soon 字型大小設定 (手機版 vs 電腦版) === */
        .coming-soon h2 {
            font-family: 'GrandCru', sans-serif;
            color: #ffffff;
            font-size: 1.1rem;     /* 預設手機版字體大小 */
            letter-spacing: 4px;   /* 手機版字距 */
            text-transform: uppercase;
            margin: 0;
            font-weight: 300;
            opacity: 0.9;
        }

        /* 當螢幕闊度大於 768px（即平版同電腦 Desktop）時生效 */
        @media (min-width: 768px) {
            .logo img {
                max-width: 800px;  /* 電腦版 Logo 大小 */
                margin-bottom: 2.5rem; /* 電腦版寬裕距離 */
            }
            .coming-soon h2 {
                font-size: 1.8rem; /* 電腦版還原大字 */
                letter-spacing: 8px; /* 電腦版寬字距 */
                opacity: 1;
            }
        }

        /* 底部版權宣告（獨立固定喺畫面最底層，絕對不隨背景縮放或郁動） */
        .footer-copy {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            color: #FFFFFF;
            font-size: 10px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 300;
            letter-spacing: 1px;
            text-transform: none;
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <!-- 動態背景圖片層 -->
    <div class="bg-image-container">
        <img src="bg_landingPage.png" alt="Background Image">
    </div>

    <!-- 內容容器 -->
    <div class="bg-container">
        <div class="content">
            <div class="logo">
                <img src="logo.png" alt="GroovyHouse Creative Logo">
            </div>
            <div class="coming-soon">
                <h2>COMING SOON</h2>
            </div>
        </div>
    </div>

    <!-- 底部版權宣告（完全獨立於背景之外，保證企定唔郁） -->
    <div class="footer-copy">
        © 2026 GroovyHouse Ltd. All Rights Reserved.
    </div>

</body>
</html>
