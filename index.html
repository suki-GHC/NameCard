<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GroovyHouse Creative</title>
    <!-- 引入 Google Fonts: Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500&display=swap" rel="stylesheet">
    <style>
        /* 宣告自訂字型 GrandCru-LightS (僅用於 Coming Soon) */
        @font-face {
            font-family: 'GrandCru';
            src: url('GrandCru-LightS.woff2') format('woff2');
            font-weight: 300;
            font-style: normal;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 300;
            background-color: #040814;
        }

        /* 快速流動嘅專屬藍調漸層背景 */
        .page-container {
            width: 100%;
            height: 100vh;
            background: linear-gradient(135deg, #e9fcff 0%, #2ecaf1 50%, #24419c 100%);
            background-size: 300% 300%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            animation: fastFlowGradient 3s ease-in-out infinite alternate;
        }

        /* 高速流動變色動畫（3秒極速循環） */
        @keyframes fastFlowGradient {
            0% {
                background-position: 0% 20%;
            }
            50% {
                background-position: 100% 80%;
            }
            100% {
                background-position: 50% 100%;
            }
        }

        /* 中間內容區（Logo + Coming Soon） */
        .content {
            text-align: center;
            padding: 20px;
            z-index: 2;
        }

        .logo img {
            max-width: 280px;
            width: 100%;
            height: auto;
            margin-bottom: 1rem;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        .coming-soon h2 {
            font-family: 'GrandCru', sans-serif;
            color: #ffffff;
            font-size: 1.1rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin: 0;
            font-weight: 300;
            opacity: 0.95;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }

        /* 桌面版放大調整 */
        @media (min-width: 768px) {
            .logo img {
                max-width: 750px;
                margin-bottom: 2.2rem;
            }
            .coming-soon h2 {
                font-size: 1.8rem;
                letter-spacing: 8px;
            }
        }

        /* 底部 Copyright */
        .footer-copy {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.85);
            font-size: 10px;
            letter-spacing: 1px;
            z-index: 2;
            white-space: nowrap;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>

    <div class="page-container">
        <!-- 中間 Logo 與 Coming Soon -->
        <div class="content">
            <div class="logo">
                <img src="logo.png" alt="GroovyHouse Creative Logo">
            </div>
            <div class="coming-soon">
                <h2>COMING SOON</h2>
            </div>
        </div>

        <!-- 底部版權宣告 -->
        <div class="footer-copy">
            © GroovyHouse Ltd. All Rights Reserved.
        </div>
    </div>

</body>
</html>
