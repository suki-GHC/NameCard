<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suki Chu | GroovyHouse Creative</title>
    <!-- 引入 Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 FontAwesome 圖示 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 引入 Google Fonts: Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 300;
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            background-color: #040814; /* 底層深藍夜空色 */
        }

        /* 頁面排版容器 */
        .page-layout {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1rem;
        }

        /* 4個精緻動態光暈背景容器 */
        .css-bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
            background: radial-gradient(circle at 50% 50%, #0d1b3a 0%, #040814 100%);
        }

        /* 光暈 1：右上角主藍色光暈（中小型尺寸，明顯流動） */
        .glow-orb-1 {
            position: absolute;
            top: 5%;
            right: 5%;
            width: 45vw;
            height: 45vw;
            background: radial-gradient(circle, rgba(0, 130, 255, 0.7) 0%, rgba(0, 70, 200, 0.3) 50%, transparent 75%);
            border-radius: 50%;
            filter: blur(45px);
            animation: floatOrb1 5s ease-in-out infinite alternate;
        }

        /* 光暈 2：左下角深藍色光暈（明顯位移與旋轉） */
        .glow-orb-2 {
            position: absolute;
            bottom: 5%;
            left: 5%;
            width: 50vw;
            height: 50vw;
            background: radial-gradient(circle, rgba(14, 85, 210, 0.65) 0%, rgba(4, 30, 100, 0.3) 50%, transparent 80%);
            border-radius: 50%;
            filter: blur(50px);
            animation: floatOrb2 6s ease-in-out infinite alternate;
        }

        /* 光暈 3：左上角靛藍流動光暈 */
        .glow-orb-3 {
            position: absolute;
            top: 10%;
            left: 10%;
            width: 40vw;
            height: 40vw;
            background: radial-gradient(circle, rgba(30, 100, 240, 0.6) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(45px);
            animation: floatOrb3 4.5s ease-in-out infinite alternate;
        }

        /* 光暈 4：右下角亮藍色光暈 */
        .glow-orb-4 {
            position: absolute;
            bottom: 10%;
            right: 10%;
            width: 42vw;
            height: 42vw;
            background: radial-gradient(circle, rgba(0, 110, 255, 0.65) 0%, rgba(10, 40, 120, 0.2) 60%, transparent 80%);
            border-radius: 50%;
            filter: blur(45px);
            animation: floatOrb4 5.5s ease-in-out infinite alternate;
        }

        /* 動畫設定：大幅增強郁動幅度、位移與旋轉，肉眼非常顯眼 */
        @keyframes floatOrb1 {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); }
            100% { transform: translate(-18%, 20%) scale(1.3) rotate(20deg); }
        }

        @keyframes floatOrb2 {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); }
            100% { transform: translate(22%, -18%) scale(1.25) rotate(-25deg); }
        }

        @keyframes floatOrb3 {
            0% { transform: translate(0, 0) scale(0.9) rotate(0deg); }
            100% { transform: translate(25%, 22%) scale(1.35) rotate(30deg); }
        }

        @keyframes floatOrb4 {
            0% { transform: translate(0, 0) scale(1.1) rotate(0deg); }
            100% { transform: translate(-22%, -22%) scale(0.85) rotate(-20deg); }
        }

        /* 玻璃擬態卡片 */
        .glass-card {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
            margin-top: -55px; 
        }

        /* 兩端自然收尖嘅半透明白線 */
        .sharp-divider {
            width: 80%;
            height: 1px;
            background: linear-gradient(90deg, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.4) 50%, rgba(255, 255, 255, 0) 100%);
            margin: 24px auto 24px auto; 
        }

        /* 卡片整體彈入動畫 */
        @keyframes cardEntrance {
            from { opacity: 0; transform: translateY(20px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .animate-entrance {
            animation: cardEntrance 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* 優雅且有層次感嘅漸顯動畫類別 */
        .fade-in-up {
            opacity: 0;
            transform: translateY(14px);
            animation: fadeInUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .delay-1 { animation-delay: 0.15s; }
        .delay-2 { animation-delay: 0.28s; }
        .delay-3 { animation-delay: 0.41s; }
        .delay-4 { animation-delay: 0.54s; }
        .delay-5 { animation-delay: 0.67s; }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body class="relative">

    <!-- 4個動態光暈背景層 -->
    <div class="css-bg-container">
        <div class="glow-orb-1"></div>
        <div class="glow-orb-2"></div>
        <div class="glow-orb-3"></div>
        <div class="glow-orb-4"></div>
    </div>

    <!-- 頁面排版容器 -->
    <div class="page-layout">
        <!-- 主卡片容器 -->
        <div class="w-full max-w-sm glass-card rounded-[2.8rem] px-8 py-10 text-center text-white relative z-10 animate-entrance">
            
            <!-- Company Logo 與 Company Name -->
            <div class="mb-2 fade-in-up delay-1">
                <div class="w-90 h-24 mx-auto flex items-center justify-center overflow-hidden opacity-90 transition-transform duration-500 hover:scale-105">
                    <img src="logo.png" alt="Company Logo" class="w-full h-full object-contain">
                </div>
                <h2 class="text-[11px] uppercase tracking-[0.25em] text-gray-200 font-extralight -mt-2">GroovyHouse Limited</h2>
            </div>

            <!-- 兩端自然收尖嘅半透明白線 -->
            <div class="sharp-divider fade-in-up delay-2"></div>

            <!-- 姓名與 Job Title -->
            <div class="mb-6 fade-in-up delay-3">
                <h1 class="text-2xl font-light tracking-wide mb-2 text-white">Suki Chu</h1>
                <div class="inline-block px-4 py-1.5 rounded-full bg-white/10 border border-white/10 text-white/90 text-xs font-light tracking-widest backdrop-blur-sm transition-all duration-300 hover:bg-white/20">
                    Digital & Motion Specialist
                </div>
            </div>

            <!-- 按鈕群組 -->
            <div class="space-y-4 mb-8">
                <!-- 3個圓形 Icon 按鈕並排置中 -->
                <div class="flex items-center justify-center gap-4 mb-7 fade-in-up delay-4">
                    <!-- WhatsApp Icon -->
                    <a href="https://wa.me/85296026777" target="_blank" title="WhatsApp"
                       class="w-14 h-14 flex items-center justify-center bg-white/10 hover:bg-emerald-600 text-white text-xl rounded-full transition-all duration-300 border border-white/15 shadow-lg hover:scale-110 hover:shadow-emerald-500/30">
                        <i class="fa-brands fa-whatsapp"></i>
                    </a>

                    <!-- Call Icon -->
                    <a href="tel:+85296026777" title="Call"
                       class="w-14 h-14 flex items-center justify-center bg-white/10 hover:bg-white/25 text-white text-lg rounded-full transition-all duration-300 border border-white/15 shadow-lg hover:scale-110 hover:shadow-white/20">
                        <i class="fa-solid fa-phone"></i>
                    </a>

                    <!-- Email Icon -->
                    <a href="mailto:suki@groovyhousecreative.com" title="Email"
                       class="w-14 h-14 flex items-center justify-center bg-white/10 hover:bg-white/25 text-white text-lg rounded-full transition-all duration-300 border border-white/15 shadow-lg hover:scale-110 hover:shadow-white/20">
                        <i class="fa-solid fa-envelope"></i>
                    </a>
                </div>

                <!-- 下方：Our Portfolio 按鈕與 vCard 按鈕 -->
                <div class="space-y-3.5 fade-in-up delay-5">
                    <!-- Our Portfolio 連結 -->
                    <a href="portfolio.pdf" target="_blank" 
                       class="w-full py-3.5 bg-white/10 hover:bg-white/20 backdrop-blur-sm text-white text-xs font-light tracking-wide rounded-2xl transition-all duration-300 shadow-md hover:scale-[1.02] flex items-center justify-center gap-2 border border-white/10">
                        <i class="fa-solid fa-file-lines text-sm"></i> Our Portfolio
                    </a>

                    <!-- 儲存聯絡人按鈕 (vCard) -->
                    <button onclick="downloadVCard()" 
                            class="w-full py-3.5 bg-white/15 hover:bg-white/25 backdrop-blur-sm text-white text-xs font-light tracking-wide rounded-2xl transition-all duration-300 shadow-md hover:scale-[1.02] flex items-center justify-center gap-2 border border-white/10">
                        <i class="fa-solid fa-address-book text-sm"></i> Save Contact
                    </button>
                </div>
            </div>

            <!-- 頁尾版權 -->
            <p class="text-[10px] text-gray-400 font-extralight tracking-widest fade-in-up delay-5">© 2026 GroovyHouse Ltd. All Rights Reserved.</p>
        </div>
    </div>

    <!-- JavaScript -->
    <script>
        function downloadVCard() {
            const vCardData = 
`BEGIN:VCARD
VERSION:3.0
N:Chu;Suki;;;
FN:Suki Chu
TITLE:Digital & Motion Specialist
ORG:GroovyHouse Creative
TEL;TYPE=CELL:+85296026777
EMAIL:suki@groovyhousecreative.com
END:VCARD`;

            const blob = new Blob([vCardData], { type: 'text/vcard;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.setAttribute('download', 'Suki_Chu.vcf');
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
